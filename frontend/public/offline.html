<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexao - VeloMail</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        color-scheme: light;
        --background: 220 43% 98%;
        --foreground: 221 48% 12%;
        --muted-foreground: 217 16% 43%;
        --card: 0 0% 100%;
        --border: 216 25% 89%;
        --primary: 201 100% 48%;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --background: 221 54% 8%;
          --foreground: 210 40% 98%;
          --muted-foreground: 214 20% 68%;
          --card: 219 49% 12%;
          --border: 217 31% 23%;
          --primary: 195 100% 57%;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }

      main {
        width: 100%;
        max-width: 380px;
        padding: 32px 24px;
        text-align: center;
        border: 1px solid hsl(var(--border));
        border-radius: 16px;
        background: hsl(var(--card));
        box-shadow: 0 12px 32px rgb(10 37 78 / 0.1);
      }

      img { width: 148px; height: auto; }

      h1 {
        margin: 20px 0 8px;
        font-size: 20px;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: hsl(var(--muted-foreground));
      }

      button {
        margin-top: 24px;
        width: 100%;
        min-height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: 10px;
        background: hsl(var(--primary));
        color: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid hsl(var(--primary));
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.png" alt="VeloMail" />
      <h1>Voce esta sem conexao</h1>
      <p>Nao foi possivel carregar a VeloMail agora. Assim que a internet voltar, seus dados aparecem atualizados.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
