# ============================================================================
# ATENCAO (PLANO MEDIA-6): este arquivo e para DESENVOLVIMENTO LOCAL.
#
# O deploy de producao NAO usa este compose. Ele executa `docker run` explicitos
# em .github/scripts/deploy-production-remote.sh. Editar este arquivo NAO muda
# nada em producao.
#
# Os limites abaixo sao mantidos em paridade com os do script de deploy para que
# o ambiente local reproduza o comportamento de producao sob restricao de
# recursos. Se alterar um limite aqui, altere tambem no script de deploy.
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: ultrazend-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ultrazend
      - POSTGRES_USER=ultrazend
      - POSTGRES_PASSWORD=ultrazend
    # Postgres NAO e mais publicado no host: so a rede interna alcanca 5432.
    # Para depurar localmente use `docker compose exec postgres psql ...`.
    expose:
      - "5432"
    # Tuning dimensionado para o limite DO CONTAINER (256m), nao para a RAM do host.
    command:
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
    # `deploy.resources` e chave do Swarm; `mem_limit`/`cpus`/`pids_limit` no
    # nivel do servico sao o equivalente explicito que o Compose v2 aplica.
    # Paridade com o script de deploy (PLANO ALTA-4).
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ultrazend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultrazend -d ultrazend"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Container efemero: aplica schema + seed e sai. Roda ANTES da API, para que
  # o container residente nao carregue o Prisma CLI nem rode migration a cada
  # restart.
  ultrazend-migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migration
    container_name: ultrazend-migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DB_CLIENT=pg
      - DATABASE_URL=postgresql://ultrazend:ultrazend@postgres:5432/ultrazend?schema=public
      - LOG_FILE_PATH=/app/logs
      # SUPER_ADMIN_PASSWORD e obrigatorio em producao: o seed falha sem ele.
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?defina SUPER_ADMIN_PASSWORD}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-admin@velomail.com.br}
    command: sh -c "npm run migrate:latest && npm run seed:super-admin"
    volumes:
      - ultrazend-logs:/app/logs
      - /var/lib/ultrazend/configs:/app/configs
    networks:
      - ultrazend-network
    # Paridade com o script de deploy (PLANO ALTA-4).
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ultrazend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: ultrazend-api
    labels:
      - com.ultrazend.component=application
      - com.ultrazend.service=backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ultrazend-migration:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_CLIENT=pg
      - PORT=3001
      # Abaixo do limite de 512M do container, deixando folga para memoria
      # nativa/off-heap do Node.
      - NODE_OPTIONS=--max-old-space-size=384
      - DATABASE_URL=postgresql://ultrazend:ultrazend@postgres:5432/ultrazend?schema=public
      - LOG_FILE_PATH=/app/logs
      - SMTP_HOST=localhost
      - SMTP_PORT=25
      - ULTRAZEND_DIRECT_DELIVERY=true
      - ENABLE_DKIM=true
      - DKIM_PRIVATE_KEY_PATH=/app/configs/dkim-keys/velomail.com.br-default-private.pem
      - DKIM_SELECTOR=default
      - DKIM_DOMAIN=velomail.com.br
    # Migration saiu daqui: roda no servico ultrazend-migration. O container
    # residente apenas sobe a aplicacao.
    command: node dist/index.js
    # Paridade com o script de deploy (PLANO ALTA-4). CPU/PIDs maiores que os
    # demais: e o container que atende requisicoes.
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 300
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ultrazend-logs:/app/logs
      - ultrazend-storage:/app/storage
      - /var/lib/ultrazend/configs:/app/configs
    networks:
      - ultrazend-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health/simple', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

volumes:
  postgres-data:
    driver: local
  ultrazend-logs:
    driver: local
    driver_opts:
      type: none
      device: /var/lib/ultrazend/logs
      o: bind
  ultrazend-storage:
    driver: local

networks:
  ultrazend-network:
    driver: bridge
