name: Quality checks

on:
  pull_request:

permissions:
  contents: read

# Em push para `main` este workflow NAO roda. O gate de qualidade daquele
# caminho e o job `quality` do deploy-production.yml, que bloqueia o build.
# Rodar os dois no mesmo push compilava frontend e backend duas vezes.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked-file policy
        run: node .github/scripts/check-tracked-sensitive-files.mjs
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit -- --runInBand
      - run: npm audit --omit=dev

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
